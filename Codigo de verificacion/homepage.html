<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
            overflow: hidden;
        }

        .hero {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            z-index: 1;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: bold;
            color: #2d3a4b;
            letter-spacing: 2px;
            text-shadow: 0 4px 32px rgba(102, 166, 255, 0.15);
            margin-bottom: 0.5em;
        }

        /* Decorative shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.18;
            z-index: 0;
        }

        .shape1 {
            width: 320px;
            background: linear-gradient(135deg, #66a6ff 0%, #89f7fe 100%);
            top: -80px;
            left: -80px;
        }

        .shape2 {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #fff 0%, #66a6ff 100%);
            bottom: 40px;
            right: 60px;
        }

        .shape3 {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #89f7fe 0%, #fff 100%);
            top: 60px;
            right: 120px;
        }

        .shape4 {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #66a6ff 0%, #fff 100%);
            bottom: 120px;
            left: 80px;
        }

        .wave {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            min-width: 100vw;
            max-width: 100vw;
            height: 180px;
            z-index: 2;
            display: block;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="hero">
        <div class="hero-title">Homepage</div>
        <div class="hero-sub">Bienvenido a tu página principal</div>
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
        <div class="shape shape4"></div>
        <svg class="wave" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="#fff" fill-opacity="1"
                d="M0,224L48,197.3C96,171,192,117,288,117.3C384,117,480,171,576,197.3C672,224,768,224,864,197.3C960,171,1056,117,1152,117.3C1248,117,1344,171,1392,197.3L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">
            </path>
        </svg>
    </div>
</body>

</html>
